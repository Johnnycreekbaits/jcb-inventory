function dbPost(t,b){return fetch(SB_URL+"/rest/v1/"+t,{method:"POST",headers:Object.assign({},HDR,{"Prefer":"resolution=merge-duplicates,return=minimal"}),body:JSON.stringify(b)}).then(function(r){if(!r.ok)return r.text().then(function(e){throw new Error(e);});});}

var DEFAULT_COSTS=[
  {id:"baby-hawg",name:"Baby Hawg",series:"Baby Hawgs",unit:"bag",cogs:1.04},
  {id:"craw",name:"Craw",series:"Craws",unit:"bag",cogs:1.04},

  {id:"swim-bait",name:"Swim Bait",series:"Swim Bait",unit:"bag",cogs:1.04},

];
var COGS_CORRECTIONS={"variety-pack":7.28};
function loadCostsLocal(){
  var s=localStorage.getItem("jcb_costs");var saved=null;
  if(s){try{saved=JSON.parse(s);}catch(e){}}
  if(!saved)return DEFAULT_COSTS.map(function(c){return Object.assign({},c);});
  var result=saved.slice();
  DEFAULT_COSTS.forEach(function(def){
    var existing=result.find(function(r){return r.id===def.id;});
    if(!existing){result.push(Object.assign({},def));}
    else{
      if(!existing.series)existing.series=def.series;
      if(COGS_CORRECTIONS[def.id]!==undefined&&existing.cogs!==COGS_CORRECTIONS[def.id])existing.cogs=COGS_CORRECTIONS[def.id];
    }
  });
  return result;
}
var costProfiles=loadCostsLocal();
function mergeMissingDefaults(profiles){
  var toAdd=[];
  DEFAULT_COSTS.forEach(function(def){
    if(!profiles.find(function(c){return c.id===def.id;})){profiles.push(Object.assign({},def));toAdd.push(Object.assign({},def));}
  });
  if(toAdd.length>0)dbPost("cost_profiles",toAdd).catch(function(){});
}
function saveCosts(){
  localStorage.setItem("jcb_costs",JSON.stringify(costProfiles));
  dbPost("cost_profiles",costProfiles).catch(function(e){console.warn("Cost profile sync:",e);});
}
function deleteCostFromDB(id){dbDelete("cost_profiles","id=eq."+id).catch(function(){});}
var EXP_CATS=["Advertising","Auto and Truck Expense","Dues and Subscriptions","Employee Meals","Federal Excise Tax","Fuel Expense","Interest Expense","Legal and Accounting","Office Expense","Other Taxes, Fees & Licenses","Outside Services","Payroll","Penalties","Rent","Repairs and Maintenance","Shop Expense","Supplies and Small Tools","Training Expense","Travel Expense","Utilities Expense"];
var MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function getChannelPrice(prod,channel){
  if(channel==="Sample/Promo"||channel==="Internal"||channel==="Sponsorship"||channel==="Sponsorship/Promo")return 0;
  if(prod&&prod.series==="JC Walker"){
    if(channel==="Dealer"||channel==="Distro")return 10.99;
  }
  if(prod&&prod.pack>=8&&prod.price>0&&prod.price<=7.50){
    if(channel==="Dealer")return 3.50;
    if(channel==="Distro")return 2.80;
    if(channel==="Pro Staff")return 5.00;
  }
  return prod?prod.price:0;
}
function matchCostProfile(prod){
  if(!prod)return null;
  var s=(prod.series||"").toLowerCase();
  var n=(prod.name||"").toLowerCase();
  var match=costProfiles.find(function(c){return c.series&&c.series.toLowerCase()===s;});
  if(match)return match;
  match=costProfiles.find(function(c){
    var cn=c.name.toLowerCase();
    return n.indexOf(cn)>=0||cn.split(" ").some(function(w){return w.length>=5&&n.indexOf(w)>=0;});
  });
  return match||null;
}
function getItemCOGS(qty,prod){var cp=matchCostProfile(prod);return cp?cp.cogs*qty:0;}
function calcInventoryValue(){var total=0;products.forEach(function(p){if(p.series==="Bundles")return;var cp=matchCostProfile(p);if(cp)total+=p.qty*cp.cogs;});return total;}
function calcAccountsReceivable(){
  var total=0,count=0;
  logs.filter(function(l){return(l.ch==="Dealer"||l.ch==="Distro")&&l.st==="Out"&&!l.paid;}).forEach(function(l){
    total+=calcOrder(l,products).rev;count++;
  });
  return{total:total,count:count};
}
function showARModal(){
  var unpaid=logs.filter(function(l){return(l.ch==="Dealer"||l.ch==="Distro")&&l.st==="Out"&&!l.paid;});
  unpaid.sort(function(a,b){return a.date<b.date?-1:1;});
  var rows=unpaid.map(function(l){
    var amt=calcOrder(l,products).rev;
    var days=Math.floor((Date.now()-new Date(l.date))/86400000);
    var dcolor=days>30?"#dc2626":days>14?"#d97706":"#475569";
    return'<div class="ar-row"><div style="flex:1;min-width:0;"><div style="font-weight:700;font-size:13px;">'+(l.person||l.name)+'</div><div style="font-size:11px;color:#94a3b8;">'+l.ch+' &middot; '+l.date+(l.project?' &middot; '+l.project:'')+'</div></div><div style="text-align:right;flex-shrink:0;margin-left:10px;"><div style="font-family:\'Bebas Neue\',cursive;font-size:18px;color:#dc2626;">'+fmt$(amt)+'</div><div style="font-size:10px;font-weight:700;color:'+dcolor+';">'+days+'d outstanding</div></div></div>';
  }).join("");
  var total=unpaid.reduce(function(s,l){return s+calcOrder(l,products).rev;},0);
  document.body.insertAdjacentHTML("beforeend",'<div class="ar-overlay" id="arOverlay"><div class="ar-sheet"><div class="ar-header"><div><div style="font-family:\'Bebas Neue\',cursive;font-size:22px;color:#dc2626;">UNPAID INVOICES</div><div style="font-size:11px;color:#94a3b8;">'+unpaid.length+' orders &middot; '+fmt$(total)+' outstanding</div></div><button style="background:#f1f5f9;border:none;border-radius:8px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;" id="arClose">&times; Close</button></div><div class="ar-body">'+rows+'</div></div></div>');
  document.getElementById("arClose").onclick=function(){var o=document.getElementById("arOverlay");if(o)o.remove();};
  document.getElementById("arOverlay").onclick=function(e){if(e.target===this){this.remove();}};
}
function parseItems(raw){try{if(!raw)return[];var p=JSON.parse(raw);return Array.isArray(p)?p:(p.items&&Array.isArray(p.items)?p.items:[]);}catch(e){return[];}}
// Partial returns (Returns tab) on orders still "Out": {logId:{pid:qtyReturned}}. Fully returned orders are excluded elsewhere.
var partialReturns={};
function setPartialReturns(rows){partialReturns={};rows.forEach(function(r){var m=partialReturns[r.log_id]||(partialReturns[r.log_id]={});(r.items||[]).forEach(function(i){m[i.pid]=(m[i.pid]||0)+i.qty;});});}
// net(pid,qty) → qty minus whatever of that line has come back (each returned unit is used once)
function returnNetter(log){
  var back=log.st==="Out"&&partialReturns[log.id]?Object.assign({},partialReturns[log.id]):{};
  return function(pid,qty){var r=Math.min(qty,back[pid]||0);if(r)back[pid]-=r;return qty-r;};
}
function calcOrder(log,prods){
  var items=parseItems(log.items);
  var rev=0,cogs=0;
  var net=returnNetter(log);
  if(items.length>0){
    items.forEach(function(item){
      var p=prods.find(function(x){return x.id===item.pid;});
      var q=net(item.pid,item.qty);
      rev+=q*(item.price||0);
      cogs+=getItemCOGS(q,p);
    });
  }else{
    var p=prods.find(function(x){return x.id===log.pid;});
    var q=net(log.pid,log.qty);
    rev+=q*getChannelPrice(p||{price:log.price||0,pack:8},log.ch||"Retail");
    cogs+=getItemCOGS(q,p);
  }
  return{rev:rev,cogs:cogs};
}

async function hashPw(pw){
  var buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,"0");}).join("");
}

var activeTab="dash",period="month";
var expMonth=new Date().toISOString().slice(0,7);
var impText="",impPrev=null,impMsg="",pdfBusy=false;

function fmt$(n){return"$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtPct(n){return n.toFixed(1)+"%";}
function showToast(msg,type){var t=document.createElement("div");t.className="toast";t.style.background=type==="err"?"#dc2626":type==="info"?"#2563eb":"#16a34a";t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},3000);}

function getPeriodRange(){
  var now=new Date(),y=now.getFullYear(),m=now.getMonth();
  if(period==="month")return{start:new Date(y,m,1),end:new Date(y,m+1,0)};
  if(period==="lastmonth"){var pm=m-1,py=y;if(pm<0){pm=11;py--;}return{start:new Date(py,pm,1),end:new Date(py,pm+1,0)};}
  if(period==="quarter"){var q=Math.floor(m/3);return{start:new Date(y,q*3,1),end:new Date(y,q*3+3,0)};}
  if(period==="lastquarter"){var q=Math.floor(m/3)-1,qy=y;if(q<0){q=3;qy--;}return{start:new Date(qy,q*3,1),end:new Date(qy,q*3+3,0)};}
  if(period==="year")return{start:new Date(y,0,1),end:new Date(y,11,31)};
  if(period==="lastyear")return{start:new Date(y-1,0,1),end:new Date(y-1,11,31)};
  if(period==="alltime"){var ae=logs.length>0?logs[logs.length-1].date:"2026-01-01";var ap=ae.split("-");return{start:new Date(+ap[0],+ap[1]-1,+ap[2]),end:new Date()};}
}

function getPeriodMonths(){
  var r=getPeriodRange(),months=[],d=new Date(r.start.getFullYear(),r.start.getMonth(),1);
  while(d<=r.end){months.push(d.toISOString().slice(0,7));d=new Date(d.getFullYear(),d.getMonth()+1,1);}
  return months;
}
function localDateStr(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function getPeriodLogs(){var r=getPeriodRange();var s=localDateStr(r.start),e=localDateStr(r.end);return logs.filter(function(l){return l.date>=s&&l.date<=e&&l.st!=="Returned";});}
function getPeriodExpenses(){if(!expReady)return[];var ms=getPeriodMonths();return expenses.filter(function(e){return ms.indexOf(e.month)>=0;});}

function calcSummary(fl,fe){
  var rev=0,cogs=0,expTotal=0;
  fl.forEach(function(l){var o=calcOrder(l,products);rev+=o.rev;cogs+=o.cogs;});
  fe.forEach(function(e){expTotal+=Number(e.amount);});
  var gross=rev-cogs,net=gross-expTotal;
  return{rev:rev,cogs:cogs,gross:gross,grossPct:rev>0?(gross/rev)*100:0,expenses:expTotal,net:net,netPct:rev>0?(net/rev)*100:0,orders:fl.length};
}

function periodLabel(){
  var now=new Date(),y=now.getFullYear(),m=now.getMonth();
  if(period==="month")return MONTHS[m]+" "+y;
  if(period==="lastmonth"){var pm=m-1,py=y;if(pm<0){pm=11;py--;}return MONTHS[pm]+" "+py;}
  if(period==="quarter")return"Q"+(Math.floor(m/3)+1)+" "+y;
  if(period==="lastquarter"){var q=Math.floor(m/3)-1,qy=y;if(q<0){q=3;qy--;}return"Q"+(q+1)+" "+qy;}
  if(period==="year")return"Full Year "+y;
  if(period==="lastyear")return"Full Year "+(y-1);
  if(period==="alltime")return"All Time";
  return"";
}

function boot(){
  if(!localStorage.getItem("jcb_finance_auth")){showLogin();return;}
  Promise.all([
    dbGet("products","?order=name,color"),
    dbGet("logs","?order=date.desc"),
    dbGet("expenses","?order=month.desc,created_at.desc").catch(function(){expReady=false;return[];}),
    dbGet("returns","?select=log_id,items&log_id=not.is.null").catch(function(){return[];})
  ]).then(function(res){
    products=res[0];logs=res[1];expenses=res[2];setPartialReturns(res[3]);
    render();
    loadTransfers().then(function(){if(activeTab==="tr"||activeTab==="prod")render();});

// Shipping collected from customers vs. what labels cost us (logs.ship_paid / logs.ship_cost).
// Kept out of Net Profit for now; "missing" = orders that shipped money but have no label cost entered.
function calcShipping(fl){
  var s={paid:0,cost:0,orders:0,missing:0};
  fl.forEach(function(l){
    var hasPaid=l.ship_paid!=null,hasCost=l.ship_cost!=null;
    if(!hasPaid&&!hasCost)return;
    s.orders++;s.paid+=Number(l.ship_paid||0);s.cost+=Number(l.ship_cost||0);
    if(!hasCost)s.missing++;
  });
  s.net=s.paid-s.cost;
  return s;
}
function shippingCardHTML(fl){
  var s=calcShipping(fl);
  if(s.orders===0)return'';
  var netColor=s.net>=0?"#16a34a":"#dc2626";
  var cell=function(val,lbl,color){return'<div style="flex:1;text-align:center;"><div class="kpi-val" style="color:'+color+';">'+val+'</div><div class="kpi-lbl">'+lbl+'</div></div>';};
  return'<div class="card" style="border:1px solid #bfdbfe;"><div style="font-weight:700;font-size:13px;margin-bottom:8px;">Shipping</div><div style="display:flex;gap:8px;">'
    +cell(fmt$(s.paid),"Collected","#3878C8")+cell(fmt$(s.cost),"Label Cost","#475569")+cell((s.net<0?"-":"")+fmt$(Math.abs(s.net)),"Net",netColor)
    +'</div><div style="font-size:11px;color:#94a3b8;margin-top:8px;text-align:center;">'+s.orders+' orders'+(s.missing?' &middot; <span style="color:#dc2626;font-weight:600;">'+s.missing+' missing label cost</span>':'')+'</div></div>';
}

        var item={pid:raw.pid,price:raw.price,qty:net(raw.pid,raw.qty)};if(!item.qty)return;
        var p=products.find(function(x){return x.id===item.pid;});
        var cp=matchCostProfile(p||null);
        var key=cp?cp.id:(p?p.name:"unknown");
        if(!byType[key])byType[key]={name:cp?cp.name:(p?p.name:"Unknown"),unit:cp?cp.unit:"bag",qty:0,cogs:0,rev:0,channels:{}};
        byType[key].qty+=item.qty;
        byType[key].cogs+=getItemCOGS(item.qty,p||null);
        byType[key].rev+=item.qty*(item.price||0);

      });
    }else{
      var p=products.find(function(x){return x.id===l.pid;});

      byType[key].qty+=lq;

  return periodBarHTML()

// ── Transfers: JCB Manufacturing (vendor) → Johnny Creek Baits, LLC (buyer) ──
var TR_SKIP_SERIES=["Bundles","Apparel"];
var PO_DEFAULT_NOTE="For resale — sales tax exempt (CDTFA-230 on file)";
var currentUser=localStorage.getItem("jcb_user")||"";
var batches=[],batchRecvAll={},pos=[],trReady=null,trErr="";
var trMonth=localDateStr(new Date()).slice(0,7),trHistCache={},trLoading={};
var trInFlight=false,poDraft=null;

function escHtml(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function round2(n){n=Number(n)||0;return Math.round((n+(n>=0?1:-1)*1e-9)*100)/100;}
function monthRange(ym){var y=parseInt(ym.slice(0,4)),m=parseInt(ym.slice(5,7));var last=new Date(y,m,0).getDate();return{start:ym+"-01",end:ym+"-"+String(last).padStart(2,"0")};}
function monthLabel(ym){return MONTHS[parseInt(ym.slice(5,7))-1]+" "+ym.slice(0,4);}
function dayAfter(d){var p=d.split("-");var x=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2])+1);return x;}
function localStart(d){var p=d.split("-");return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));}
function prodLabel(name,color){return escHtml(name+(color?" — "+color:""));}
function trSkip(prod){return !prod||TR_SKIP_SERIES.indexOf(prod.series)>=0;}

function loadTransfers(){
  return Promise.all([
    dbGet("production_batches","?order=batch_date.desc,created_at.desc"),
    dbGet("history","?select=batch_id,qty_before,qty_after&batch_id=not.is.null"),
    dbGet("transfer_pos","?order=po_date.desc,created_at.desc")
  ]).then(function(r){
    batches=r[0];pos=r[2];batchRecvAll={};
    r[1].forEach(function(h){batchRecvAll[h.batch_id]=(batchRecvAll[h.batch_id]||0)+((h.qty_after||0)-(h.qty_before||0));});
    trReady=true;trErr="";
  }).catch(function(e){trReady=false;trErr=e.message||String(e);});
}
// History rows between two local dates (inclusive), cached per key
function fetchHist(start,end){
  var key=start+"|"+end;
  if(trHistCache[key])return Promise.resolve(trHistCache[key]);
  return dbGet("history","?select=id,product_id,product_name,color,change_type,qty_before,qty_after,changed_by,note,changed_at,batch_id&order=changed_at.asc&changed_at=gte."+encodeURIComponent(localStart(start).toISOString())+"&changed_at=lt."+encodeURIComponent(dayAfter(end).toISOString()))
    .then(function(rows){trHistCache[key]=rows;return rows;});
}
function receivedByProduct(hist){
  var m={};
  hist.forEach(function(h){
    if(h.change_type!=="production")return;
    var d=(h.qty_after||0)-(h.qty_before||0);if(!d)return;
    var k=h.product_id;if(!m[k])m[k]={pid:k,name:h.product_name,color:h.color||"",qty:0};m[k].qty+=d;
  });
  return m;
}
function batchesInMonth(ym){var r=monthRange(ym);return batches.filter(function(b){return b.batch_date>=r.start&&b.batch_date<=r.end;});}

function trHTML(){
  var head='<div class="section-title">TRANSFERS</div><div class="section-sub">JCB Manufacturing &rarr; Johnny Creek Baits, LLC &middot; production batches, receipts &amp; intercompany POs</div>';
  if(trReady===null)return head+'<div class="loading"><div class="spin">&#x1F69A;</div></div>';
  if(trReady===false)return head+'<div class="card" style="border:1px solid #fde68a;"><div style="font-weight:700;color:#92400e;margin-bottom:8px;">&#x2699;&#xFE0F; One-time setup required</div><div style="font-size:12px;color:#64748b;line-height:1.7;">The <code>production_batches</code> / <code>transfer_pos</code> tables are missing. Run <code>supabase/sql/2026-10-10_intercompany_transfers.sql</code> in the Supabase SQL editor, then refresh.</div><div style="font-size:10px;color:#94a3b8;margin-top:8px;">'+escHtml(trErr.slice(0,200))+'</div></div>';
  var userBar=currentUser?'<div style="font-size:11px;color:#94a3b8;margin-bottom:10px;">Signed as <strong style="color:#475569;">'+escHtml(currentUser)+'</strong> &middot; <a href="#" id="trChangeUser" style="color:#ea580c;">change</a></div>'
    :'<div class="card" style="border:1px solid #fed7aa;"><div style="font-weight:700;font-size:13px;margin-bottom:8px;">Who is using this device?</div><div style="display:flex;gap:6px;flex-wrap:wrap;">'+["Thomas","Mike","Greg"].map(function(n){return'<button class="btn-outline" data-truser="'+n+'">'+n+'</button>';}).join("")+'</div><div style="font-size:10px;color:#94a3b8;margin-top:6px;">Used for &ldquo;entered by&rdquo; / &ldquo;updated by&rdquo; on batches and POs.</div></div>';
  var r=monthRange(trMonth),key=r.start+"|"+r.end,hist=trHistCache[key];
  var monthBar='<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;"><input type="month" class="field-input" id="trMonthSel" value="'+trMonth+'" style="max-width:180px;"/><button class="btn-gray" id="trReload" style="padding:9px 12px;">&#x1F504;</button></div>';
  if(!hist){
    if(!trLoading[key]){trLoading[key]=true;fetchHist(r.start,r.end).then(function(){trLoading[key]=false;if(activeTab==="tr")render();}).catch(function(e){trLoading[key]=false;showToast("History load failed: "+e.message,"err");});}
    return head+userBar+monthBar+'<div class="loading"><div class="spin">&#x1F69A;</div></div>'+posHTML();
  }
  // Produced vs Received
  var rec=receivedByProduct(hist),mb=batchesInMonth(trMonth),rows={};
  mb.forEach(function(b){var k=b.product_id;if(!rows[k])rows[k]={name:b.product_name,color:b.color,made:0,recv:0};rows[k].made+=b.qty;});
  Object.keys(rec).forEach(function(k){if(!rows[k])rows[k]={name:rec[k].name,color:rec[k].color,made:0,recv:0};rows[k].recv+=rec[k].qty;});
  var keys=Object.keys(rows).sort(function(a,b){var x=rows[a],y=rows[b];return(x.name+x.color).localeCompare(y.name+y.color);});
  var tMade=0,tRecv=0;
  var tbl=keys.length===0?'<div style="text-align:center;color:#94a3b8;padding:18px;font-size:12px;">No batches or production receipts in '+monthLabel(trMonth)+'</div>':'<table style="width:100%;border-collapse:collapse;font-size:12px;"><thead><tr style="color:#94a3b8;font-size:9px;text-transform:uppercase;letter-spacing:.05em;"><th style="text-align:left;padding:6px 4px;">Product</th><th style="text-align:right;padding:6px 4px;">Produced</th><th style="text-align:right;padding:6px 4px;">Received</th><th style="text-align:right;padding:6px 4px;">Diff</th></tr></thead><tbody>'+keys.map(function(k){var x=rows[k],d=x.made-x.recv;tMade+=x.made;tRecv+=x.recv;return'<tr style="border-top:1px solid #f1f5f9;"><td style="padding:7px 4px;">'+prodLabel(x.name,x.color)+'</td><td style="text-align:right;padding:7px 4px;">'+x.made+'</td><td style="text-align:right;padding:7px 4px;">'+x.recv+'</td><td style="text-align:right;padding:7px 4px;font-weight:700;color:'+(d===0?"#16a34a":d>0?"#d97706":"#dc2626")+';">'+(d>0?"+":"")+d+'</td></tr>';}).join("")+'</tbody><tfoot><tr style="border-top:2px solid #e2e8f0;font-weight:700;"><td style="padding:8px 4px;">Total</td><td style="text-align:right;padding:8px 4px;">'+tMade+'</td><td style="text-align:right;padding:8px 4px;">'+tRecv+'</td><td style="text-align:right;padding:8px 4px;">'+(tMade-tRecv>0?"+":"")+(tMade-tRecv)+'</td></tr></tfoot></table><div style="font-size:10px;color:#94a3b8;margin-top:6px;">Diff &gt; 0 = made but not received yet &middot; Diff &lt; 0 = received with no batch logged that month</div>';
  var kpis='<div class="kpi-grid"><div class="kpi" style="background:#faf5ff;border:2px solid #c4b5fd;"><div class="kpi-val" style="color:#7c3aed;">'+tMade+'</div><div class="kpi-lbl">Bags Produced</div></div><div class="kpi" style="background:#f0fdf4;border:2px solid #86efac;"><div class="kpi-val" style="color:#16a34a;">'+tRecv+'</div><div class="kpi-lbl">Bags Received</div></div></div>';
  // Open batches (any month)
  var ob=batches.filter(function(b){return b.qty-(batchRecvAll[b.id]||0)>0;});
  var obHTML='<div class="card"><div style="font-weight:700;font-size:13px;margin-bottom:8px;">&#x23F3; Open Batches <span style="color:#94a3b8;font-weight:500;font-size:11px;">made, not fully received &middot; all months</span></div>'+(ob.length===0?'<div style="font-size:12px;color:#94a3b8;">None &mdash; everything made has been received.</div>':ob.map(function(b){var got=batchRecvAll[b.id]||0;return'<div class="exp-item"><div style="flex:1;min-width:0;"><div style="font-weight:600;">'+prodLabel(b.product_name,b.color)+'</div><div style="font-size:10px;color:#94a3b8;">'+escHtml(b.batch_no||"No batch #")+' &middot; '+b.batch_date+' &middot; made '+b.qty+' &middot; received '+got+'</div></div><span class="exp-cat" style="background:#fff7ed;color:#ea580c;">'+(b.qty-got)+' left</span></div>';}).join(""))+'</div>';
  // Other stock increases that may be unlogged production
  var inc={};
  hist.forEach(function(h){
    if(["+","add","adjustment","edit"].indexOf(h.change_type)<0)return;
    var d=(h.qty_after||0)-(h.qty_before||0);if(d<=0)return;
    var day=localDateStr(new Date(h.changed_at));var k=h.product_id+"|"+day+"|"+h.change_type+"|"+(h.changed_by||"");
    if(!inc[k])inc[k]={name:h.product_name,color:h.color||"",day:day,type:h.change_type,who:h.changed_by||"?",qty:0,n:0,note:h.note||""};inc[k].qty+=d;inc[k].n++;
  });
  var incList=Object.keys(inc).map(function(k){return inc[k];}).sort(function(a,b){return a.day.localeCompare(b.day)||b.qty-a.qty;});
  var incTotal=incList.reduce(function(s,x){return s+x.qty;},0);
  var incHTML='<div class="card" style="border:1px solid #fde68a;"><div style="font-weight:700;font-size:13px;margin-bottom:4px;">&#x26A0;&#xFE0F; Other Stock Increases <span style="color:#94a3b8;font-weight:500;font-size:11px;">'+incTotal+(incTotal===1?' bag':' bags')+' &middot; might be unlogged production</span></div><div style="font-size:10px;color:#94a3b8;margin-bottom:8px;">+ taps, new products, positive edits/adjustments in '+monthLabel(trMonth)+'. These are NOT on the PO unless re-entered as Receive Production.</div>'+(incList.length===0?'<div style="font-size:12px;color:#94a3b8;">None.</div>':incList.slice(0,80).map(function(x){return'<div class="exp-item"><div style="flex:1;min-width:0;"><div style="font-weight:600;">'+prodLabel(x.name,x.color)+'</div><div style="font-size:10px;color:#94a3b8;">'+x.day+' &middot; '+escHtml(x.type)+(x.n>1?' &times;'+x.n:'')+' &middot; '+escHtml(x.who)+(x.note&&x.n===1?' &middot; '+escHtml(x.note):'')+'</div></div><span class="exp-cat" style="background:#fffbeb;color:#d97706;">+'+x.qty+'</span></div>';}).join("")+(incList.length>80?'<div style="font-size:10px;color:#94a3b8;margin-top:6px;">+'+(incList.length-80)+' more</div>':''))+'</div>';
  // This month's batches (editable)
  var mbHTML='<div class="card"><div style="font-weight:700;font-size:13px;margin-bottom:8px;">&#x1F9EA; Batches Made in '+monthLabel(trMonth)+'</div>'+(mb.length===0?'<div style="font-size:12px;color:#94a3b8;">No batches logged. Log them in the inventory app &rarr; Stock &rarr; Log Batch Made.</div>':mb.map(function(b){var got=batchRecvAll[b.id]||0;return'<div class="exp-item"><div style="flex:1;min-width:0;"><div style="font-weight:600;">'+prodLabel(b.product_name,b.color)+' <span style="color:#7c3aed;">&times;'+b.qty+'</span></div><div style="font-size:10px;color:#94a3b8;">'+escHtml(b.batch_no||"No batch #")+' &middot; '+b.batch_date+' &middot; made by '+escHtml(b.made_by||"?")+' &middot; entered by <strong>'+escHtml(b.entered_by||"?")+'</strong>'+(b.edited_by?' &middot; edited by '+escHtml(b.edited_by)+' '+new Date(b.edited_at).toLocaleDateString():'')+' &middot; received '+got+'</div></div><button class="btn-gray" style="padding:5px 10px;font-size:11px;" data-tredb="'+b.id+'">Edit</button></div>';}).join(""))+'</div>';
  return head+userBar+monthBar+kpis+'<div class="card"><div style="font-weight:700;font-size:13px;margin-bottom:8px;">&#x1F4E6; Produced vs Received &middot; '+monthLabel(trMonth)+'</div>'+tbl+'</div>'+obHTML+incHTML+mbHTML+posHTML();
}

function poStatusStyle(s){return{Draft:"background:#f1f5f9;color:#475569;",Issued:"background:#eff6ff;color:#2563eb;",Received:"background:#faf5ff;color:#7c3aed;",Paid:"background:#dcfce7;color:#16a34a;"}[s]||"";}

// ── Batch edit (finance side) ──
function trBatchModal(id){
  var b=batches.find(function(x){return x.id===id;});if(!b)return;
  var opts=products.filter(function(p){return !trSkip(p);}).map(function(p){return'<option value="'+p.id+'"'+(p.id===b.product_id?" selected":"")+'>'+prodLabel(p.name,p.color)+'</option>';}).join("");
  document.body.insertAdjacentHTML("beforeend",'<div class="ar-overlay" id="trBM"><div class="ar-sheet"><div class="ar-header"><div style="font-family:\'Bebas Neue\',cursive;font-size:22px;color:#7c3aed;">EDIT BATCH</div><button class="btn-gray" id="trBMClose">&times; Close</button></div><div class="ar-body">'
    +'<div class="field-wrap"><label class="field-label">Product</label><select class="field-input" id="tbProd">'+opts+'</select></div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;"><div class="field-wrap"><label class="field-label">Bags Made</label><input class="field-input" type="number" min="1" id="tbQty" value="'+b.qty+'"/></div><div class="field-wrap"><label class="field-label">Date Made</label><input class="field-input" type="date" id="tbDate" value="'+b.batch_date+'"/></div></div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;"><div class="field-wrap"><label class="field-label">Batch #</label><input class="field-input" id="tbNo" value="'+escHtml(b.batch_no)+'"/></div><div class="field-wrap"><label class="field-label">Made By</label><input class="field-input" id="tbMadeBy" value="'+escHtml(b.made_by)+'"/></div></div>'
    +'<div class="field-wrap"><label class="field-label">Notes</label><input class="field-input" id="tbNote" value="'+escHtml(b.note)+'"/></div>'
    +'<div style="font-size:11px;color:#94a3b8;margin-bottom:12px;">Entered by '+escHtml(b.entered_by||"?")+(b.edited_by?' &middot; last edited by '+escHtml(b.edited_by)+' '+new Date(b.edited_at).toLocaleString():'')+' &middot; '+(batchRecvAll[b.id]||0)+' received</div>'
    +'<div style="display:flex;gap:8px;"><button class="btn-primary" id="tbSave" style="flex:1;padding:12px;">Save Changes</button><button class="del-btn" id="tbDel" style="padding:10px 14px;">Delete</button></div></div></div></div>');
  var close=function(){var m=document.getElementById("trBM");if(m)m.remove();};
  document.getElementById("trBMClose").onclick=close;
  document.getElementById("trBM").onclick=function(e){if(e.target===this)close();};
  var done=function(msg){close();showToast(msg);return loadTransfers().then(render);};
  document.getElementById("tbSave").onclick=function(){
    if(trInFlight)return;if(!currentUser){showToast("Pick who you are first","err");return;}
    var p=products.find(function(x){return x.id===parseInt(document.getElementById("tbProd").value);});
    var qty=parseInt(document.getElementById("tbQty").value)||0,date=document.getElementById("tbDate").value;
    if(!p||qty<=0||!date){showToast("Product, bags and date are required","err");return;}
    var btn=this;trInFlight=true;btn.disabled=true;btn.textContent="Saving...";
    dbPatch("production_batches","id=eq."+b.id,{product_id:p.id,product_name:p.name,color:p.color||"",qty:qty,batch_date:date,batch_no:document.getElementById("tbNo").value.trim(),made_by:document.getElementById("tbMadeBy").value.trim(),note:document.getElementById("tbNote").value.trim(),edited_by:currentUser,edited_at:new Date().toISOString()})
      .then(function(){return done("Batch updated");})
      .catch(function(e){showToast("Error: "+e.message,"err");btn.disabled=false;btn.textContent="Save Changes";})
      .then(function(){trInFlight=false;});
  };
  document.getElementById("tbDel").onclick=function(){
    if(trInFlight)return;
    if(!confirm("Delete batch "+(b.batch_no||"")+"? Inventory is not changed."))return;
    var btn=this;trInFlight=true;btn.disabled=true;
    dbDelete("production_batches","id=eq."+b.id).then(function(){return done("Batch deleted");})
      .catch(function(e){showToast("Error: "+e.message,"err");btn.disabled=false;})
      .then(function(){trInFlight=false;});
  };
}

// ── Purchase orders ──
function lastPO(){return pos.slice().sort(function(a,b){return String(b.created_at).localeCompare(String(a.created_at));})[0]||null;}
function nextPONumber(){var mx=0;pos.forEach(function(p){var m=String(p.po_number||"").match(/(\d+)\s*$/);if(m)mx=Math.max(mx,parseInt(m[1]));});return"TPO-"+String(mx+1).padStart(4,"0");}
function unitCostFor(pid){var p=products.find(function(x){return x.id===pid;});var cp=matchCostProfile(p);return cp?Number(cp.cogs):null;}
function priceAt(cost,markup){return cost==null?0:round2(cost*(1+(Number(markup)||0)/100));}
function makeLine(pid,qty,markup){
  var p=products.find(function(x){return x.id===pid;})||{};var cost=unitCostFor(pid);
  return{pid:pid,name:p.name||"",color:p.color||"",series:p.series||"",qty:qty,cost:cost,price:priceAt(cost,markup)};
}
function linesFromReceived(rec,markup){
  return Object.keys(rec).map(function(k){var pid=parseInt(k);var p=products.find(function(x){return x.id===pid;});if(trSkip(p)||rec[k].qty<=0)return null;return makeLine(pid,rec[k].qty,markup);})
    .filter(Boolean).sort(function(a,b){return(a.name+a.color).localeCompare(b.name+b.color);});
}
function poTotal(d){return round2(d.lines.reduce(function(s,l){return s+(Number(l.qty)||0)*(Number(l.price)||0);},0));}

function newPO(){
  if(!currentUser){showToast("Pick who you are first","err");return;}
  var r=monthRange(trMonth),lp=lastPO(),mk=lp?Number(lp.markup_pct):15;
  showToast("Loading received units...","info");
  fetchHist(r.start,r.end).then(function(hist){
    poDraft={id:null,po_number:nextPONumber(),po_date:localDateStr(new Date()),period_start:r.start,period_end:r.end,status:"Draft",markup_pct:mk,
      vendor_name:lp?lp.vendor_name:"JCB Manufacturing",vendor_address:lp?lp.vendor_address:"",buyer_name:lp?lp.buyer_name:"Johnny Creek Baits, LLC",buyer_address:lp?lp.buyer_address:"",
      terms:"Net 30",notes:PO_DEFAULT_NOTE,paid_date:null,lines:linesFromReceived(receivedByProduct(hist),mk)};
    openPOEditor();
  }).catch(function(e){showToast("Error: "+e.message,"err");});
}
function editPO(id){
  var p=pos.find(function(x){return x.id===id;});if(!p)return;
  poDraft=JSON.parse(JSON.stringify(p));
  if(typeof poDraft.lines==="string"){try{poDraft.lines=JSON.parse(poDraft.lines);}catch(e){poDraft.lines=[];}}
  poDraft.lines=poDraft.lines||[];
  openPOEditor();
}

function openPOEditor(){
  document.body.insertAdjacentHTML("beforeend",'<div class="ar-overlay" id="poEd"><div class="ar-sheet" style="max-height:94vh;"><div class="ar-header"><div style="font-family:\'Bebas Neue\',cursive;font-size:22px;color:#ea580c;">'+(poDraft.id?"EDIT PURCHASE ORDER":"NEW PURCHASE ORDER")+'</div><button class="btn-gray" id="poClose">&times; Close</button></div><div class="ar-body" id="poBody"></div></div></div>');
  document.getElementById("poClose").onclick=closePOEditor;
  renderPOEditor();
}
function closePOEditor(){var m=document.getElementById("poEd");if(m)m.remove();poDraft=null;}

function poField(label,key,type,extra){var v=poDraft[key];return'<div class="field-wrap"><label class="field-label">'+label+'</label><input class="field-input" data-pof="'+key+'" type="'+(type||"text")+'" value="'+escHtml(v==null?"":v)+'"'+(extra||"")+'/></div>';}
function renderPOEditor(){
  var d=poDraft,body=document.getElementById("poBody");if(!body||!d)return;
  var g2='display:grid;grid-template-columns:1fr 1fr;gap:8px;';
  var lines=d.lines.map(function(l,i){
    var noCost=l.cost==null;
    return'<div style="border-bottom:1px solid #f1f5f9;padding:8px 0;"><div style="display:flex;justify-content:space-between;gap:6px;"><div style="font-weight:600;font-size:12px;">'+prodLabel(l.name,l.color)+(noCost?' <span style="color:#dc2626;font-size:10px;">no cost profile</span>':'<span style="color:#94a3b8;font-size:10px;"> &middot; cost '+fmt$(l.cost)+'</span>')+'</div><button class="del-btn" data-polrm="'+i+'">&#x2715;</button></div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px;align-items:center;"><label style="font-size:10px;color:#94a3b8;">Qty<input class="field-input" style="padding:7px 9px;" type="number" min="0" step="1" data-polq="'+i+'" value="'+l.qty+'"/></label><label style="font-size:10px;color:#94a3b8;">Unit $<input class="field-input" style="padding:7px 9px;" type="number" min="0" step="0.01" data-polp="'+i+'" value="'+l.price+'"/></label><div style="text-align:right;font-weight:700;font-size:13px;" data-polt="'+i+'">'+fmt$((Number(l.qty)||0)*(Number(l.price)||0))+'</div></div></div>';
  }).join("");
  var addOpts=products.filter(function(p){return !trSkip(p);}).map(function(p){return'<option value="'+p.id+'">'+prodLabel(p.name,p.color)+'</option>';}).join("");
  body.innerHTML=
    '<div style="'+g2+'">'+poField("PO #","po_number")+poField("PO Date","po_date","date")+'</div>'
    +'<div style="'+g2+'">'+poField("Period Start","period_start","date")+poField("Period End","period_end","date")+'</div>'
    +'<div style="'+g2+'"><div class="field-wrap"><label class="field-label">Status</label><select class="field-input" data-pof="status">'+["Draft","Issued","Received","Paid"].map(function(s){return'<option'+(d.status===s?" selected":"")+'>'+s+'</option>';}).join("")+'</select></div>'+poField("Paid Date","paid_date","date")+'</div>'
    +'<div style="'+g2+'">'+poField("Terms","terms")+poField("Markup %","markup_pct","number",' step="0.1" min="0"')+'</div>'
    +'<div style="'+g2+'">'+poField("Vendor","vendor_name")+poField("Buyer","buyer_name")+'</div>'
    +'<div style="'+g2+'"><div class="field-wrap"><label class="field-label">Vendor Address</label><textarea class="field-input" rows="3" data-pof="vendor_address">'+escHtml(d.vendor_address)+'</textarea></div><div class="field-wrap"><label class="field-label">Buyer Address</label><textarea class="field-input" rows="3" data-pof="buyer_address">'+escHtml(d.buyer_address)+'</textarea></div></div>'
    +'<div class="field-wrap"><label class="field-label">Notes</label><textarea class="field-input" rows="2" data-pof="notes">'+escHtml(d.notes)+'</textarea></div>'
    +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px;"><button class="btn-outline" id="poReprice" style="padding:7px 11px;font-size:11px;">Re-price at markup</button><button class="btn-outline" id="poRefresh" style="padding:7px 11px;font-size:11px;">Refresh qty from inventory</button></div>'
    +'<div class="pl-section-hd">Lines ('+d.lines.length+')</div>'+(lines||'<div style="font-size:12px;color:#94a3b8;padding:8px 0;">No lines. Nothing was received in this period, or add one below.</div>')
    +'<div style="display:flex;gap:6px;margin:10px 0;"><select class="field-input" id="poAddSel" style="flex:1;">'+addOpts+'</select><button class="btn-gray" id="poAdd">+ Add line</button></div>'
    +'<div class="pl-total-row"><span>TOTAL</span><span id="poTot" style="font-family:\'Bebas Neue\',cursive;font-size:24px;color:#ea580c;">'+fmt$(poTotal(d))+'</span></div>'
    +(d.id?'<div style="font-size:10px;color:#94a3b8;margin:4px 0 10px;">Created by '+escHtml(d.created_by||"?")+(d.updated_by?' &middot; last updated by '+escHtml(d.updated_by)+' '+new Date(d.updated_at).toLocaleString():'')+'</div>':'')
    +'<div style="display:flex;gap:8px;margin-top:10px;"><button class="btn-primary" id="poSave" style="flex:1;padding:12px;font-size:14px;">Save</button><button class="btn-gray" id="poPrint">Print / PDF</button>'+(d.id?'<button class="del-btn" id="poDel" style="padding:10px 14px;">Delete</button>':'')+'</div>';
  wirePOEditor();
}
function wirePOEditor(){
  var d=poDraft;
  document.querySelectorAll("#poBody [data-pof]").forEach(function(el){el.oninput=el.onchange=function(){
    var k=el.dataset.pof,v=el.value;
    if(k==="markup_pct")v=v===""?0:Number(v);
    if((k==="paid_date"||k==="po_date"||k==="period_start"||k==="period_end")&&v==="")v=null;
    d[k]=v;
    if(k==="status"&&v==="Paid"&&!d.paid_date){d.paid_date=localDateStr(new Date());var pd=document.querySelector('#poBody [data-pof="paid_date"]');if(pd)pd.value=d.paid_date;}
  };});
  var upd=function(i){var t=document.querySelector('[data-polt="'+i+'"]');if(t)t.textContent=fmt$((Number(d.lines[i].qty)||0)*(Number(d.lines[i].price)||0));document.getElementById("poTot").textContent=fmt$(poTotal(d));};
  document.querySelectorAll("[data-polq]").forEach(function(el){el.oninput=function(){var i=parseInt(el.dataset.polq);d.lines[i].qty=Math.max(0,parseInt(el.value)||0);upd(i);};});
  document.querySelectorAll("[data-polp]").forEach(function(el){el.oninput=function(){var i=parseInt(el.dataset.polp);d.lines[i].price=Math.max(0,parseFloat(el.value)||0);upd(i);};el.onblur=function(){var i=parseInt(el.dataset.polp);d.lines[i].price=round2(d.lines[i].price);el.value=d.lines[i].price;upd(i);};});
  document.querySelectorAll("[data-polrm]").forEach(function(el){el.onclick=function(){d.lines.splice(parseInt(el.dataset.polrm),1);renderPOEditor();};});
  document.getElementById("poAdd").onclick=function(){
    var pid=parseInt(document.getElementById("poAddSel").value);
    if(d.lines.some(function(l){return l.pid===pid;})){showToast("Already on the PO — edit its qty","err");return;}
    d.lines.push(makeLine(pid,1,d.markup_pct));renderPOEditor();
  };
  document.getElementById("poReprice").onclick=function(){
    var n=0,skipped=0;
    d.lines.forEach(function(l){var c=l.pid!=null?unitCostFor(l.pid):null;if(c==null){skipped++;return;}l.cost=c;l.price=priceAt(c,d.markup_pct);n++;});
    renderPOEditor();showToast("Re-priced "+n+" lines at "+d.markup_pct+"%"+(skipped?" ("+skipped+" without cost left as-is)":""));
  };
  document.getElementById("poRefresh").onclick=function(){
    if(!d.period_start||!d.period_end){showToast("Set the period first","err");return;}
    var btn=this;btn.disabled=true;btn.textContent="Loading...";
    fetchHist(d.period_start,d.period_end).then(function(hist){
      if(poDraft!==d)return;
      var rec=receivedByProduct(hist),changed=0,added=0;
      d.lines.forEach(function(l){var q=rec[l.pid]?Math.max(0,rec[l.pid].qty):0;if(l.qty!==q){l.qty=q;changed++;}});
      linesFromReceived(rec,d.markup_pct).forEach(function(nl){if(!d.lines.some(function(l){return l.pid===nl.pid;})){d.lines.push(nl);added++;}});
      renderPOEditor();showToast("Qty refreshed: "+changed+" changed, "+added+" added");
    }).catch(function(e){showToast("Error: "+e.message,"err");btn.disabled=false;btn.textContent="Refresh qty from inventory";});
  };
  document.getElementById("poPrint").onclick=function(){printPO(d);};
  document.getElementById("poSave").onclick=function(){
    if(trInFlight)return;
    if(!currentUser){showToast("Pick who you are first (top of Transfers)","err");return;}
    if(!String(d.po_number||"").trim()){showToast("PO # is required","err");return;}
    if(pos.some(function(p){return p.id!==d.id&&String(p.po_number).trim()===String(d.po_number).trim();})&&!confirm("Another PO already uses "+d.po_number+". Save anyway?"))return;
    var now=new Date().toISOString();
    var row={po_number:String(d.po_number).trim(),po_date:d.po_date||null,period_start:d.period_start||null,period_end:d.period_end||null,status:d.status,markup_pct:Number(d.markup_pct)||0,
      vendor_name:d.vendor_name||"",vendor_address:d.vendor_address||"",buyer_name:d.buyer_name||"",buyer_address:d.buyer_address||"",terms:d.terms||"",notes:d.notes||"",
      lines:d.lines.map(function(l){return{pid:l.pid,name:l.name,color:l.color,series:l.series,qty:Number(l.qty)||0,cost:l.cost,price:round2(l.price)};}),
      total:poTotal(d),paid_date:d.paid_date||null,updated_by:currentUser,updated_at:now};
    var btn=this;trInFlight=true;btn.disabled=true;btn.textContent="Saving...";
    var req=d.id?dbPatch("transfer_pos","id=eq."+d.id,row):dbPost("transfer_pos",Object.assign(row,{id:Date.now()+(Math.random()*1000|0),created_by:currentUser,created_at:now}));
    req.then(function(){closePOEditor();showToast("PO saved");return loadTransfers().then(render);})
      .catch(function(e){showToast("Error: "+e.message,"err");btn.disabled=false;btn.textContent="Save";})
      .then(function(){trInFlight=false;});
  };
  var del=document.getElementById("poDel");
  if(del)del.onclick=function(){
    if(trInFlight)return;
    if(!confirm("Delete "+d.po_number+"? This cannot be undone."))return;
    trInFlight=true;del.disabled=true;
    dbDelete("transfer_pos","id=eq."+d.id).then(function(){closePOEditor();showToast("PO deleted");return loadTransfers().then(render);})
      .catch(function(e){showToast("Error: "+e.message,"err");del.disabled=false;})
      .then(function(){trInFlight=false;});
  };
}

function printPO(p){
  var lines=Array.isArray(p.lines)?p.lines:[];
  var total=round2(lines.reduce(function(s,l){return s+(Number(l.qty)||0)*(Number(l.price)||0);},0));
  var units=lines.reduce(function(s,l){return s+(Number(l.qty)||0);},0);
  var nl=function(s){return escHtml(s||"").replace(/\n/g,"<br>");};
  var th='padding:10px 6px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#64748b;';
  var td='padding:8px 6px;border-bottom:1px solid #f1f5f9;';
  var rows=lines.length?lines.map(function(l){return'<tr><td style="'+td+'">'+prodLabel(l.name,l.color)+'</td><td style="'+td+'text-align:center;">'+l.qty+'</td><td style="'+td+'text-align:right;">'+fmt$(l.price)+'</td><td style="'+td+'text-align:right;font-weight:600;">'+fmt$((Number(l.qty)||0)*(Number(l.price)||0))+'</td></tr>';}).join(""):'<tr><td colspan="4" style="'+td+'color:#94a3b8;">No lines</td></tr>';
  var lbl='font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;';
  var html='<!DOCTYPE html><html><head><meta charset="utf-8"><title>PO '+escHtml(p.po_number)+'</title>'
    +'<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">'
    +'<style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:\'DM Sans\',sans-serif;color:#1e293b;background:#fff;padding:40px;padding-top:80px;}.dl-bar{position:fixed;top:0;left:0;right:0;background:#1e293b;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;z-index:100;}.dl-bar span{font-size:12px;color:#94a3b8;}.dl-btn{background:#ea580c;color:#fff;border:none;border-radius:8px;padding:10px 22px;font-size:14px;font-weight:700;cursor:pointer;font-family:\'DM Sans\',sans-serif;}@media print{.dl-bar{display:none!important;}body{padding:20px!important;}}</style>'
    +'</head><body>'
    +'<div class="dl-bar"><span>Chrome / Edge: click button &rarr; change Destination to <strong style="color:#fff;">Save as PDF</strong></span><button class="dl-btn" onclick="window.print()">Download PDF</button></div>'
    +'<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:32px;">'
      +'<div><div style="font-family:\'Bebas Neue\',cursive;font-size:36px;color:#ea580c;letter-spacing:2px;">'+escHtml(p.buyer_name||"Johnny Creek Baits, LLC").toUpperCase()+'</div>'
      +'<div style="font-size:12px;color:#64748b;margin-top:2px;">'+nl(p.buyer_address)+'</div></div>'
      +'<div style="text-align:right;"><div style="font-family:\'Bebas Neue\',cursive;font-size:28px;color:#1e293b;">PURCHASE ORDER</div>'
      +'<div style="font-size:14px;font-weight:700;color:#ea580c;">'+escHtml(p.po_number)+'</div>'
      +'<div style="font-size:12px;color:#64748b;margin-top:4px;">Date: '+escHtml(p.po_date||"")+'</div>'
      +'<div style="font-size:12px;color:#64748b;">Period: '+escHtml(p.period_start||"")+' to '+escHtml(p.period_end||"")+'</div>'
    +'</div></div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;margin-bottom:28px;">'
      +'<div><div style="'+lbl+'">Vendor</div><div style="font-weight:700;font-size:15px;">'+escHtml(p.vendor_name)+'</div><div style="font-size:13px;color:#475569;">'+nl(p.vendor_address)+'</div></div>'
      +'<div><div style="'+lbl+'">Buyer / Ship To</div><div style="font-weight:700;font-size:15px;">'+escHtml(p.buyer_name)+'</div><div style="font-size:13px;color:#475569;">'+nl(p.buyer_address)+'</div></div>'
      +'<div><div style="'+lbl+'">Details</div><div style="font-size:13px;">Terms: <strong>'+escHtml(p.terms)+'</strong></div><div style="font-size:13px;">Status: <strong>'+escHtml(p.status)+'</strong></div>'
      +(p.paid_date?'<div style="font-size:13px;color:#16a34a;font-weight:700;margin-top:4px;">PAID '+escHtml(p.paid_date)+'</div>':'')+'</div>'
    +'</div>'
    +'<table style="width:100%;border-collapse:collapse;margin-bottom:20px;"><thead><tr style="background:#f8fafc;border-bottom:2px solid #e2e8f0;"><th style="'+th+'text-align:left;">Product</th><th style="'+th+'text-align:center;">Qty</th><th style="'+th+'text-align:right;">Unit Price</th><th style="'+th+'text-align:right;">Total</th></tr></thead><tbody>'+rows+'</tbody>'
    +'<tfoot><tr style="border-top:2px solid #e2e8f0;"><td style="padding:12px 6px;font-size:13px;color:#475569;">'+units+' units</td><td colspan="2" style="padding:12px 6px;font-weight:700;text-align:right;font-size:14px;">TOTAL</td><td style="padding:12px 6px;font-family:\'Bebas Neue\',cursive;font-size:22px;color:#ea580c;text-align:right;">'+fmt$(total)+'</td></tr></tfoot></table>'
    +(p.notes?'<div style="background:#f8fafc;border-radius:10px;padding:12px 14px;font-size:13px;color:#475569;margin-bottom:36px;">'+nl(p.notes)+'</div>':'<div style="margin-bottom:36px;"></div>')
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:40px;font-size:12px;color:#64748b;"><div style="border-top:1px solid #94a3b8;padding-top:6px;">Authorized &mdash; '+escHtml(p.buyer_name)+'</div><div style="border-top:1px solid #94a3b8;padding-top:6px;">Accepted &mdash; '+escHtml(p.vendor_name)+'</div></div>'
    +'</body></html>';
  var w=window.open("","_blank");if(!w){showToast("Allow pop-ups to print","err");return;}
  w.document.write(html);w.document.close();
}

function wireTransfers(){
  var ms=document.getElementById("trMonthSel");if(ms)ms.onchange=function(){if(ms.value){trMonth=ms.value;render();}};
  var rl=document.getElementById("trReload");if(rl)rl.onclick=function(){trHistCache={};loadTransfers().then(render);};
  var cu=document.getElementById("trChangeUser");if(cu)cu.onclick=function(e){e.preventDefault();currentUser="";render();};
  document.querySelectorAll("[data-truser]").forEach(function(b){b.onclick=function(){currentUser=b.dataset.truser;localStorage.setItem("jcb_user",currentUser);render();};});
  var np=document.getElementById("btnNewPO");if(np)np.onclick=newPO;
  document.querySelectorAll("[data-tredb]").forEach(function(b){b.onclick=function(){trBatchModal(parseInt(b.dataset.tredb));};});
  document.querySelectorAll("[data-poedit]").forEach(function(b){b.onclick=function(){editPO(parseInt(b.dataset.poedit));};});
  document.querySelectorAll("[data-poprint]").forEach(function(b){b.onclick=function(){var p=pos.find(function(x){return x.id===parseInt(b.dataset.poprint);});if(p)printPO(p);};});
}

function wire(){
  if(activeTab==="tr")wireTransfers();
  document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){activeTab=b.dataset.tab;render();};});
  document.querySelectorAll("[data-period]").forEach(function(b){b.onclick=function(){period=b.dataset.period;render();};});
  var lo=document.getElementById("btnLogout");if(lo)lo.onclick=function(){localStorage.removeItem("jcb_finance_auth");showLogin();};
  var pr=document.getElementById("btnPrint");if(pr)pr.onclick=function(){window.print();};
  var at=document.getElementById("arTile");if(at)at.onclick=showARModal;
  var ems=document.getElementById("expMonthSel");if(ems)ems.onchange=function(e){expMonth=e.target.value;impPrev=null;impMsg="";impText="";render();};
  var ta=document.getElementById("expTA");if(ta)ta.oninput=function(e){impText=e.target.value;};
  var bpe=document.getElementById("btnPreviewExp");
  if(bpe)bpe.onclick=function(){
    var lines=impText.trim().split("\n").filter(Boolean);
    if(!lines.length){impMsg="Paste data first.";impPrev=null;render();return;}
    var prev=[],bad=[];
    lines.forEach(function(line){
      var pts=line.split(/\s*\|\s*|\t|,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(function(s){return s.trim().replace(/^"|"$/g,"");});
      var cat,desc,amt;
      if(pts.length>=3){cat=pts[0];desc=pts[1];amt=parseFloat(pts[2]);}
      else if(pts.length===2){cat=pts[0];desc=pts[0];amt=parseFloat(pts[1]);}
      else{bad.push(line);return;}
      if(isNaN(amt)){bad.push(line);return;}
      var mc=EXP_CATS.find(function(c){return c.toLowerCase().indexOf(cat.toLowerCase())>=0||cat.toLowerCase().indexOf(c.toLowerCase().split(" ")[0])>=0;});
      prev.push({id:Date.now()+(Math.random()*9999|0),month:expMonth,category:mc||cat,description:desc,amount:amt,created_by:"Owner"});
    });
    impPrev=prev.length?prev:null;
    impMsg="Matched "+prev.length+" rows"+(bad.length?" &middot; "+bad.length+" unmatched":"");
    render();
    var ta2=document.getElementById("expTA");if(ta2)ta2.value=impText;
  };
  var bpp=document.getElementById("btnPnlPdf"),pf=document.getElementById("pnlFile");
  if(bpp&&pf){
    bpp.onclick=function(){if(!pdfBusy)pf.click();};
    pf.onchange=function(){
      var file=pf.files&&pf.files[0];if(!file)return;
      if(file.size>10*1024*1024){showToast("PDF is larger than 10 MB","err");return;}
      pdfBusy=true;impPrev=null;impMsg="";render();
      var rd=new FileReader();
      rd.onload=function(){
        fetch(SB_URL+"/functions/v1/pnl-import",{method:"POST",headers:{"Authorization":"Bearer "+SB_KEY,"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({pdf:String(rd.result),categories:EXP_CATS})})
        .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||("Error "+r.status));return j;});})
        .then(function(j){
          pdfBusy=false;
          if(/^\d{4}-\d{2}$/.test(j.month))expMonth=j.month;
          var label=MONTHS[parseInt(expMonth.split("-")[1])-1]+" "+expMonth.split("-")[0]+" P&L";
          impPrev=j.lines.filter(function(l){return Number(l.amount)!==0;}).map(function(l){return{id:Date.now()+(Math.random()*99999|0),month:expMonth,category:l.category,description:label,amount:Math.round(Number(l.amount)*100)/100,created_by:"P&L PDF"};});
          if(!impPrev.length)impPrev=null;
          var existing=expenses.filter(function(e){return e.month===expMonth;}).length;
          impMsg="Read "+(impPrev?impPrev.length:0)+" lines for "+label.replace(" P&L","")+" &middot; total "+fmt$(j.sum)+" vs report "+fmt$(j.printed_total)
            +(j.matches?' <span style="color:#16a34a;font-weight:700;">&#x2713; matches</span>':' <span style="color:#dc2626;font-weight:700;">&#x26A0; does not match the report total &mdash; check the lines before applying</span>')
            +(existing?'<br><span style="color:#dc2626;font-weight:700;">&#x26A0; '+existing+' expenses are already saved for this month &mdash; applying adds these on top.</span>':'');
          render();
        })
        .catch(function(e){pdfBusy=false;impMsg='<span style="color:#dc2626;">'+e.message+'</span>';render();showToast("Could not read PDF","err");});
      };
      rd.onerror=function(){pdfBusy=false;render();showToast("Could not open file","err");};
      rd.readAsDataURL(file);
    };
  }
  var bae=document.getElementById("btnApplyExp");
  if(bae)bae.onclick=function(){
    if(!impPrev||!impPrev.length)return;
    dbPost("expenses",impPrev).then(function(){
      showToast("Saved "+impPrev.length+" expenses!");
      expenses=expenses.concat(impPrev);
      impPrev=null;impText="";impMsg="";render();
    }).catch(function(e){showToast("Error: "+e.message,"err");});
  };
  document.querySelectorAll(".cp-inp").forEach(function(inp){
    inp.onchange=function(){
      var idx=parseInt(inp.dataset.cpidx);
      var val=parseFloat(inp.value);
      if(!isNaN(val)&&val>=0){costProfiles[idx].cogs=val;saveCosts();showToast("Saved ✓");}
      else inp.value=costProfiles[idx].cogs.toFixed(2);
    };
  });
  document.querySelectorAll("[data-delcp]").forEach(function(b){
    b.onclick=function(){
      var idx=parseInt(b.dataset.delcp);
      if(!confirm("Remove "+costProfiles[idx].name+" from cost profiles?"))return;
      var cpId=costProfiles[idx].id;
      costProfiles.splice(idx,1);
      deleteCostFromDB(cpId);
      saveCosts();render();
    };
  });
  var btnAddCp=document.getElementById("btnAddCp");
  if(btnAddCp)btnAddCp.onclick=function(){
    var name=(document.getElementById("cpNewName").value||"").trim();
    var unit=document.getElementById("cpNewUnit").value;
    var cogs=parseFloat(document.getElementById("cpNewCogs").value);
    if(!name||isNaN(cogs)||cogs<0){showToast("Fill in all fields","err");return;}
    var id=name.toLowerCase().replace(/[^a-z0-9]+/g,"-");
    costProfiles.push({id:id,name:name,unit:unit,cogs:cogs});
    saveCosts();showToast("Added "+name+"!");render();
  };
  document.querySelectorAll("[data-delexp]").forEach(function(b){
    b.onclick=function(){
      var id=parseInt(b.dataset.delexp);
      if(!confirm("Delete this expense?"))return;
      dbDelete("expenses","id=eq."+id).then(function(){
        expenses=expenses.filter(function(e){return e.id!==id;});
        showToast("Deleted");render();
      }).catch(function(){showToast("Error","err");});
    };
  });
}

boot();
</script>
